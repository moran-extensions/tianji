<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>填记 · 历史管理</title><link rel="stylesheet" href="ui.css"></head><body><main class="shell manager"><header><div class="brand"><img src="icons/icon48.png" width="36" height="36" alt=""><div><strong>填记</strong><span>输入历史管理</span></div></div><button id="privacy" class="text-link">隐私说明</button></header><div class="eyebrow">本机保存 · 按站点和字段隔离</div><h1>常用输入，都在这里</h1><p class="muted">字段旁的按钮可以选择回填。删除记录只影响插件，不会修改原网页。</p><div class="toolbar"><div class="filter"><label for="site-filter">站点</label><select id="site-filter"><option value="">全部站点</option></select></div><div class="filter grow"><label for="search">查找记录</label><input id="search" type="search" placeholder="搜索字段名、页面路径或历史值"></div></div><div class="overview"><span id="summary">正在读取…</span><button id="clear-site" class="danger-link" hidden>清空此站点记录</button></div><div id="fields"></div><p id="empty" class="empty" hidden>还没有历史记录。打开需要使用的网页，点击扩展启用本站，然后在普通输入框输入一次。</p><button id="more" class="secondary" hidden>显示更多字段</button><p id="message" class="message" role="status" hidden></p><footer><span>每字段最近 30 条 · 不使用云同步</span><span>仅用于普通非敏感内容</span></footer></main><dialog id="confirm-dialog"><h2 id="confirm-title">确认删除？</h2><p id="confirm-copy" class="muted"></p><div class="button-row"><button id="confirm-delete" class="danger">确认删除</button><button id="confirm-cancel" class="secondary">取消</button></div></dialog><script type="module" src="manager.js"></script></body></html>
