<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>填记 · 输入历史</title><link rel="stylesheet" href="ui.css"></head><body class="popup"><main class="shell"><header><div class="brand"><img src="icons/icon48.png" width="36" height="36" alt=""><div><strong>填记</strong><span>让重复输入少一点</span></div></div><span class="pill">本机记录</span></header><div class="eyebrow">当前站点</div><h1 id="site">正在读取网页…</h1><p id="status" class="muted">只在你主动启用的站点记住普通输入框。</p><button id="toggle" class="primary wide" disabled>启用本站记录</button><div class="stats"><div><strong id="field-count">0</strong><span>个字段</span></div><div><strong id="value-count">0</strong><span>条历史值</span></div></div><ol class="steps"><li>输入完成，离开输入框时保存</li><li>点击输入框旁的历史按钮</li><li>搜索并选择，直接回填当前字段</li></ol><p class="note">跳过可识别的密码、验证码和密钥字段。只回填内容，不主动提交表单。</p><button id="manage" class="secondary wide">管理历史记录</button><p id="message" class="message" role="status" hidden></p><footer><span>无需服务器 · 不上传记录</span><button id="privacy" class="text-link">隐私说明</button></footer></main><script type="module" src="popup.js"></script></body></html>
