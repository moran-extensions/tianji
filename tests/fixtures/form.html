<!doctype html><html><head><meta charset="utf-8"><title>普通表单 · 示例页面</title><style>body{margin:0;background:#f5f6f9;color:#23324a;font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}nav{background:#14233b;color:#fff;padding:18px 32px}main{max-width:760px;margin:35px auto;padding:28px 34px;border:1px solid #dfe5ef;border-radius:14px;background:#fff}h1{font-size:25px;margin:0 0 20px}label{display:block;margin-top:18px;margin-bottom:6px;font-weight:600}input,textarea{box-sizing:border-box;width:100%;border:1px solid #bdc9da;border-radius:7px;padding:10px 12px;font:inherit;color:inherit}input:focus,textarea:focus{outline:2px solid #90b4ef;outline-offset:1px}button{margin:20px 8px 0 0;padding:10px 17px;border:0;border-radius:7px;background:#245bd4;color:white;font:inherit;cursor:pointer}.muted{font-size:13px;color:#66738b}.form-group{margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}</style></head><body><nav>表单示例</nav><main><h1>常用输入</h1><p class="muted">虚构示例，仅用于演示输入历史功能。</p><form id="sample-form"><div class="form-group"><label for="sampleText">常用内容</label><div name="parameter"><input type="hidden" name="name" value="CONTENT"><input id="sampleText" type="text" name="value" placeholder="输入常用内容"></div></div><div class="form-group"><label for="reference">参考编号</label><div name="parameter"><input type="hidden" name="name" value="REFERENCE"><input id="reference" type="text" name="value" placeholder="输入参考编号"></div></div><div class="row"><div><label for="sample-number">数量</label><input id="sample-number" name="sample_number" type="number" min="1" max="1000"></div><div><label for="readonly">只读字段</label><input id="readonly" name="readonly_value" value="do not record" readonly></div></div><label for="notes">普通备注</label><textarea id="notes" name="notes" rows="2"></textarea><div class="form-group"><label for="secret-token">API Token</label><div name="parameter"><input type="hidden" name="name" value="API_TOKEN"><input id="secret-token" type="text" name="value"></div></div><label for="password">密码</label><input id="password" type="password" name="password" autocomplete="current-password"><button id="build" type="submit">提交（仅测试计数）</button><button id="add" type="button">增加动态字段</button></form><p id="model" class="muted"></p></main><script>window.submissions=0;window.events=[];document.getElementById('sample-form').addEventListener('submit',e=>{e.preventDefault();submissions++;});document.getElementById('sampleText').addEventListener('input',e=>{events.push({type:'input',value:e.target.value});document.getElementById('model').textContent='当前输入：'+e.target.value});document.getElementById('sampleText').addEventListener('change',e=>events.push({type:'change',value:e.target.value}));document.getElementById('add').onclick=()=>{const label=document.createElement('label');label.htmlFor='dynamic';label.textContent='动态内容';const input=document.createElement('input');input.id='dynamic';input.name='dynamic_id';document.getElementById('sample-form').append(label,input);};</script></body></html>
